name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.7)'
        required: false
        default: 'v1.2.7'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.7.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.7
        path: dist/BunkerParser-v1.2.7.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.7' }}
        name: "Bunker Parser v1.2.7 (New Crown Design, Pause/Resume, Sustained Turbo Speed)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.7 ДЛЯ ANDROID** 🐈‍⬛

          Глобальный редизайн по прикреплённому макету, функция Паузы/Продолжения и устранение просадки скорости после 1000 ключей!

          🛠 **Что нового в v1.2.7:**
          - 👑 **Новый эксклюзивный кибер-дизайн (Crowned B Badge):**
            - Полная интеграция 3D эмблемы Бункера с короной в заголовке и в иконках приложения.
            - Шапка с быстрыми кнопками: Telegram канал, чат сообщества, настройки и смена фона.
            - Глянцевые переключатели режимов («МИКС ⚡», «ЧС 🖤», «БС 🤍») с неоновым свечением.
            - Блок фильтра сервисов с неоновой подсветкой выбранного уровня и галочкой.
            - Стильные раздельные кнопки «Выбрать TXT» и «Из буфера».
            - Обновлённый HUD с 4 метриками (Всего, Живые, Мёртвые, Прогресс) с фирменными иконками и градиентным ползунком.
          - ⏸ **Кнопка ПАУЗА / ПРОДОЛЖИТЬ:**
            - Теперь при нестабильной связи проверку можно поставить на паузу в 1 клик (`⏸ ПАУЗА`).
            - При восстановлении интернета проверка продолжается (`▶ ПРОДОЛЖИТЬ`) ровно с того места, где была остановлена, без потери прогресса и найденных ключей.
            - Добавлена аккуратная кнопка `СТОП` для полного сброса при необходимости.
          - ⚡ **Устранение просадки скорости после 1000 ключей:**
            - Включён `soLinger(true, 0)` и `reuseAddress`: дескрипторы закрытых сокетов мгновенно освобождаются в ядре Linux, исключая переполнение таблицы TIME_WAIT.
            - Устранена ресурсоёмкая перекодировка URL (UriParser.rename) в цикле сканирования: теперь интерфейс летает на 120 FPS даже при 10,000+ найденных нод.
            - Скорость остаётся стабильно максимальной на протяжении всего теста.

