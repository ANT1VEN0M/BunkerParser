name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.5)'
        required: false
        default: 'v1.2.5'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.5.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.5
        path: dist/BunkerParser-v1.2.5.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.5' }}
        name: "Bunker Parser v1.2.5 (Multi-Tier Services 1..4, Zero Dead Nodes, Tier Sorting)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.5 ДЛЯ ANDROID** 🐈‍⬛

          Глобальный апдейт логики сбора и сортировки рабочих прокси-узлов: теперь чекер собирает ВСЕ живые связки сервисов без потери рабочих нод!

          🛠 **Что нового в v1.2.5:**
          - 🎯 **Мульти-сервисный сбор (1, 2, 3 и 4 сервиса):**
            - Чекер теперь независимо тестирует каждый узел на YouTube, Telegram, ChatGPT и Gemini.
            - Нода попадает в базу, если открывает хотя бы 1 сервис (или рабочий туннель).
            - Полностью мёртвые ноды (0 сервисов, никуда не заходят) отсекаются на 100%.
          - 🎛 **Интерактивный фильтр сервисов в UI:**
            - Быстрый селектор прямо на главном экране: `1+ Все живые`, `2+ Связки`, `3+ Трио`, `4/4 Строго`.
          - 👑 **Умная иерархическая сортировка:**
            - На самом верху подписки всегда элитные 4/4 узлы (`YT × TG × GPT × GEM`), затем тройные связки, затем дуэты и одиночные.
            - Внутри каждого уровня узлы отсортированы по минимальному пингу.
          - 📊 **Расширенный блок аналитики:**
            - Отображение распределения по уровням: 4/4, 3 сервиса, 2 сервиса, 1 сервис.
            - Счётчики доступности каждого конкретного сервиса (YT ✓, TG ✓, GPT ✓, GEM ✓).
          - 🛡 **Фикс совместимости XHTTP в VPN-клиенте:**
            - Строковые числа в параметрах `extra` конвертируются в целые числа, предотвращая ошибки декодирования XHTTP в клиентах.

