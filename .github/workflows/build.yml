name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.2)'
        required: false
        default: 'v1.2.2'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.2.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.2
        path: dist/BunkerParser-v1.2.2.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.2' }}
        name: "Bunker Parser v1.2.2 (Fix Xray Core Outbound JSON Schema & Latency Tests)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.2 ДЛЯ ANDROID** 🐈‍⬛

          Критическое исправление проверки Xray Core!

          🛠 **Что исправлено в v1.2.2:**
          - 🎯 **Исправлена схема JSON для Xray Core:** восстановлена структура `vnext -> users` для VLESS/VMess и `servers` для Trojan/Shadowsocks. В Reality настройки заменён параметр `password` на `publicKey`, а параметр `method` в стримах исправлен на стандартный `network`.
          - ⚡ **Честный тест туннеля через Google / Gstatic 204:** реальный пинг замеряется внутри туннеля без ложных отсевов.
          - 🖤 **Автоматический режим в ЧС/БС:** при переключении на ЧС или БС строгий фильтр 4/4 сервисов по умолчанию отключается, пропуская все реально рабочие прокси-ноды (при желании можно включить в настройках).
          - 🚀 **Поддержка Hysteria2:** добавлен надежный TCP/TLS fallback для протоколов hy2/hysteria2.
          - 🖼 **Свой фон из галереи (Custom Wallpaper).**
          - 🌐 **100% определение стран и флагов.**
          - 📊 **Интерактивная аналитика протоколов и локаций.**

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          🌐 Официальный сайт: https://kotxantidot.github.io/Mysite/
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerParser-v1.2.2.apk
