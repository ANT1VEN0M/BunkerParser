name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.1.0.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.1.0
        path: dist/BunkerParser-v1.1.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.1.0' }}
        name: "Bunker Parser v1.1.0 (Real Xray Engine & New Cyber Logo)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.1.0 ДЛЯ ANDROID** 🐈‍⬛

          Глобальное обновление чекера с интеграцией нативного ядра Xray Core и новым киберпанк-логотипом!

          🔥 **Что нового в v1.1.0:**
          - 🛡 **Настоящий тест задержки через Xray Core (Real Delay Test):** больше никаких ложных срабатываний на CDN-заглушки Cloudflare! Приложение выполняет полноценный туннельный хэндшейк (VLESS Reality / Vision / gRPC / WS, VMess, Trojan, SS, Hysteria2) и реальный HTTP-запрос через прокси.
          - 🎯 **Честный отбор 4/4 сервисов:** нода проходит фильтр МИКС только если она РЕАЛЬНО открывает YouTube (generate_204), Telegram, ChatGPT и Gemini через зашифрованный туннель.
          - 🐱 **Новый агрессивный Cyber Bunker логотип:** новый детализированный аватар кибер-кота Бункера с разноцветными неоновыми глазами (фиолетовый + бирюзовый), карбоновой бронёй и молниями. Обновлены все иконки (квадратные, круглые, foreground адаптивные).
          - ⚡ **Увеличенная скорость отсева:** мёртвые ноды отсекаются на первом этапе проверки, не тратя время на повторные запросы.
          - 💾 **Экспорт в 1 тап:** сохранение готового `.txt` файла прямо в папку `Downloads`, копирование в буфер обмена или шеринг.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          🌐 Официальный сайт: https://kotxantidot.github.io/Mysite/
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerParser-v1.1.0.apk
