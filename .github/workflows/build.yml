name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.8)'
        required: false
        default: 'v1.2.8'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.8.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.8
        path: dist/BunkerParser-v1.2.8.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.8' }}
        name: "Bunker Parser v1.2.8 (Factory / BS Mode, Port 53 DNS, URL Subscriptions, Auto-Deduplication)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.8 ДЛЯ ANDROID** 🐈‍⬛

          Специальный релиз с заточкой под «Режим Завод / Проходные / Белый список (БС)», обнаружением DNS порта 53, загрузкой по прямым ссылкам и авто-дедупликацией нод!

          🛠 **Что нового в v1.2.8:**
          - 🏭 **Режим «БС (Белый список / Заводы и глушилки)»:**
            - Теперь проверка в режиме «БС 🤍» тестирует доступность через отечественные сервисы (`ya.ru`, `vk.com`, `telegram.org`) и проверяет внешний выпуск, а не падает на заблокированном YouTube.
            - Приоритетная сортировка: российские 🇷🇺 и белорусские 🇧🇾 серверы на портах 443 и 53 поднимаются на самый верх готовой подписки `WHITE_LIST.txt`.
          - ⚡ **Детекция и подсветка DNS порта 53:**
            - Серверы на 53 порту (DNS) теперь помечаются неоновым бейджем `53 DNS` и тегом `53/DNS` в конфиге. Это ключевой порт, спасающий на сотовых операторах (МегаФон/Yota/МТС) при глушении.
            - Серверы на стандартном 443 порту получают бейдж `443`.
          - 🛡️ **Фильтр портов «Анти-глушилка (Завод / Проходная)»:**
            - Новый переключатель прямо на экране БС и в настройках: позволяет мгновенно отсечь все нестандартные порты (9000+, 8080), которые сотовые вышки у заводов дропают на корню, оставляя только бронебойные 443 и 53.
          - 🌐 **Загрузка подписок по URL («По ссылке»):**
            - Новая кнопка на главном экране и удобный диалог ввода URL подписки.
            - Автоматическое скачивание по HTTP/HTTPS с поддержкой редиректов и авто-декодированием Base64 (как в v2rayN / v2rayNG).
          - 🧹 **Автоматическая дедупликация конфигов:**
            - При парсинге из любых источников удаляются повторяющиеся хосты и порты. Больше никакого дублирования и потери времени на одинаковые серверы!

