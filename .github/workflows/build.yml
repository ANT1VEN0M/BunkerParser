name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.3)'
        required: false
        default: 'v1.2.3'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.3.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.3
        path: dist/BunkerParser-v1.2.3.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.3' }}
        name: "Bunker Parser v1.2.3 (Full-Page Scrolling, Sticky Export Dock, All Formats Support)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.3 ДЛЯ ANDROID** 🐈‍⬛

          Большое обновление интерфейса и всеядного чекера узлов!

          🛠 **Что нового в v1.2.3:**
          - 📜 **Скроллинг всего экрана:** весь экран теперь представляет собой единый плавный список. Все блоки (HUD, Аналитика со всеми 20+ странами и карточки результатов) прокручиваются от самого верха до низа без обрезания.
          - 📥 **Плавающая кибер-панель (Sticky Export Dock):** кнопки «КОПИЯ TXT», «СКАЧАТЬ» (в папку Downloads) и «Поделиться» закреплены внизу экрана поверх интерфейса — результат можно забрать в 1 клик в любой момент!
          - 🌐 **Честный тест всех протоколов (VLESS, VMess, Trojan, Shadowsocks, Hysteria2):**
            - Исправлен резолв SNI: теперь при отсутствии явного sni берётся `host` (CDN / домен), а не сырой IP.
            - Защита Base64 в Reality ключах: знаки `+` в `pbk` больше не заменяются на пробелы.
            - Добавлен мгновенный TCP Pre-check (по стандарту v2rayNG), ускоряющий проверку тысяч ключей.
            - Проверка через независимые быстрые эндпоинты `gstatic.com` и Cloudflare `generate_204`.
            - В режиме ЧС все форматы серверов честно сохраняются в живые без дискриминации.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          🌐 Официальный сайт: https://kotxantidot.github.io/Mysite/
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerParser-v1.2.3.apk
