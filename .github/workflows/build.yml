name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.3.0.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.3.0
        path: dist/BunkerParser-v1.3.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.3.0' }}
        name: "Bunker Parser v1.3.0 (Bunker Cloud Auto-Sync Edition)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          🔥 **BUNKER PARSER v1.3.0 ДЛЯ ANDROID** 🐈‍⬛

          Глобальный апгрейд: интеграция прямого Облака Бункера! Теперь проверенные рабочие ноды загружаются в 1 клик прямо из приложения без ввода ссылок и скачивания файлов.

          🛠 **Что нового в v1.3.0:**
          - ☁️ **Прямая интеграция «ОБЛАКО БУНКЕРА»:**
            - Быстрые кнопки мгновенной загрузки 5 бронебойных потоков:
              • `🌍 Микс` — проверенные зарубежные ноды под YouTube 4K, Discord, Instagram;
              • `🤍 БС` — серверы РФ и РБ для работы под вышками и сотовым глушением;
              • `🏭 Завод` — строгий бронебойный фильтр серверов на портах 443 и 53 (DNS);
              • `⚡ Турбо` — топ самых низкопинговых серверов;
              • `💬 TG SOS` — ультрастабильный канал связи для гарантированной работы Telegram.
            - Двойной зеркальный контур (jsDelivr CDN + GitHub Pages fallback): гарантирует скачивание базы даже при жестких блокировках в РФ.
          - 🔴 **Минималистичный чёрно-бело-красный тактический стиль:**
            - Глубокий обсидиановый фон (`#090909`), алый акцент (`#DC2626`) и контрастный белый.
            - Полная очистка интерфейса от лишних ссылок и мусора.
          - 🕶️ **Официальный логотип Кота-Хакера:**
            - На экранах и во всех разрешениях иконок приложения для Android.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerParser-v1.3.0.apk
