name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.6)'
        required: false
        default: 'v1.2.6'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.6.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.6
        path: dist/BunkerParser-v1.2.6.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.6' }}
        name: "Bunker Parser v1.2.6 (Turbo Engine: 15-30x Faster Checking, Async Cores, DNS Cache)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.6 (TURBO ENGINE) ДЛЯ ANDROID** 🐈‍⬛

          Глобальное ускорение проверки в 15-30 раз при сохранении 100% точности проверки всех сервисов и протоколов!

          🛠 **Что нового в v1.2.6:**
          - 🚀 **Ускорение в 15–30 раз (Turbo Core):**
            - **Сверхбыстрый TCP Pre-check (400ms):** 95% мёртвых хостов отсекаются за доли секунды.
            - **DNS-кэширование (Concurrent DNS Cache):** устраняет тысячи повторных DNS-запросов для одинаковых CDN-доменов.
            - **Параллельная проверка сервисов (Async Cores):** сервисы YouTube, Telegram, ChatGPT и Gemini проверяются одновременно в параллельных асинхронных корутинах, а не по очереди.
            - **Smart Fast Tunnel Gate:** для кандидатов с открытым портом, но мёртвыми ключами, время отсева сокращено с 18–30 секунд до единичного быстрого параллельного цикла.
            - **32 параллельных потока по умолчанию (настройка до 64 потоков):** база из 37,000 нод проверяется за считанные минуты вместо часов!
            - **Оптимизированный дефолтный таймаут:** 2.5 сек вместо 4.5 сек.
          - 🎯 **100% сохранение глубокой проверки:**
            - Честная независимая проверка каждого сервиса: `YT`, `TG`, `GPT`, `GEM`.
            - Поддержка сбора 1, 2, 3 и 4 сервисов.
            - Мёртвые узлы (0 сервисов) отсекаются на 100%.
            - Элитная сортировка: 4/4 на вершине, сортировка по пингу.

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
