name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.1)'
        required: false
        default: 'v1.2.1'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.1.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.1
        path: dist/BunkerParser-v1.2.1.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.1' }}
        name: "Bunker Parser v1.2.1 (Fix Instant Crash on Startup & Xiaomi/Android 8+)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.1 ДЛЯ ANDROID** 🐈‍⬛

          Срочный хотфикс вылета при запуске на смартфонах Xiaomi и Android 8+!

          🛠 **Исправления в v1.2.1:**
          - 💥 **Устранён вылет при старте (XmlPullParserException):** Compose `painterResource` пытался распарсить XML адаптивной иконки `<adaptive-icon>` в шапке главного экрана, что приводило к моментальному крашу при старте. Логотип перенесён в отдельный чистый PNG-растр `res/drawable/bunker_logo.png`.
          - ⚙️ **Legacy Native Packaging:** включен `useLegacyPackaging = true` для нативных библиотек Xray Core (`libgojni.so`), гарантирующий корректную загрузку библиотек Go runtime без сбоев линковщика на Xiaomi MIUI/HyperOS.
          - 🚀 **Асинхронный старт ядра:** `CoreNativeManager` переведён в фоновый поток, `Application.onCreate` теперь отрабатывает мгновенно и никогда не блокирует запуск приложения.
          - 🖼 **Свой фон из галереи (Custom Background):** выбор любого фото/обоев с неоновым затемнением и кнопкой сброса.
          - 🌐 **100% определение геолокации и флагов.**
          - 📊 **Блок аналитики найденных нод (протоколы и страны).**

          ---
          💬 Чат сообщества: https://t.me/BUNKER_K0TA
          📢 Канал Бункера: https://t.me/BUNKER_KOTA
          🤖 Telegram Бот: @BunkerCatOSBot
          🌐 Официальный сайт: https://kotxantidot.github.io/Mysite/
          👑 Создатель: @k0tlux
        files: |
          dist/BunkerParser-v1.2.1.apk
