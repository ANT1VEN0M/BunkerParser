name: Build Bunker Parser APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Xray Core (libv2ray.aar)
      run: |
        mkdir -p app/libs
        if [ ! -f "app/libs/libv2ray.aar" ]; then
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
        fi

    - name: Build APK with Gradle
      run: |
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" --stacktrace

    - name: Prepare Dist
      run: |
        mkdir -p dist
        find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/BunkerParser-v1.2.0.apk \;
        ls -la dist/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BunkerParser-v1.2.0
        path: dist/BunkerParser-v1.2.0.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || 'v1.2.0' }}
        name: "Bunker Parser v1.2.0 (Custom Gallery Wallpaper, Live GeoIP & Analytics Block)"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ⚡ **BUNKER PARSER v1.2.0 ДЛЯ ANDROID** 🐈‍⬛

          Крупное обновление с кастомизацией фона, точной геолокацией и интерактивной аналитикой протоколов и стран!

          🔥 **Что нового в v1.2.0:**
          - 🖼 **Свой фон из галереи (Custom Background):** теперь можно ставить любое фото или обои из галереи прямо на фон приложения! Реализовано стильное неоновое градиентное затемнение, сохраняющее 100% читаемость текста и футуристичный стиль. Также есть кнопка быстрого сброса фона обратно на темную тему.
          - 🌐 **Исправлено и прокачано определение геолокации:**
            - Включен защищенный сетевой доступ и многоуровневое определение стран.
            - Мгновенный парсер Unicode флагов (🇩🇪, 🇳🇱, 🇺🇸, 🇷🇺...) и русских/английских названий локаций из ремарок нод.
            - Распознавание доменных зон и префиксов серверов.
            - Быстрый резервный HTTPS GeoIP движок с автокэшированием IP-адресов.
          - 📊 **Интерактивный блок сетевой аналитики:**
            - Отображает в реальном времени найденные протоколы с неоновыми бейджами (`⚡ VLESS`, `⚡ VMESS`, `⚡ TROJAN`, `⚡ SHADOWSOCKS`, `⚡ HYSTERIA2`) и их точное количество.
            - Показывает все найденные страны с флагами (`🇩🇪 Германия 14`, `🇳🇱 Нидерланды 8`, `🇷🇺 Россия 5`...) и счётчиками.
          - 🛡 **Ядро Xray Core Real Delay:** надежная фильтрация мертвых нод и CDN-заглушек.

          ---
